<!doctype html>
<html>
  <head>
    <title>Flagger - Flag Explorer</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <meta charset="UTF-8" />
  </head>
  <body>
    <div class="header">
      <img src="assets/flagr.svg" alt="Flagger" class="flag-header" />
      <h1 class="flag-sub" id="cyber-header" data-text="// Flag Explorer"></h1>
    </div>

    <div class="controls-container">
      <!-- Search Section -->
      <div class="search-section">
        <input
          class="filter-btn search-bar"
          id="search-bar"
          type="text"
          placeholder="Filter by keyword..."
        />
      </div>

      <!-- Nav Opts -->
      <div class="nav-section">
        <button class="filter-btn" id="toggle-names">Hide Names</button>
        <button class="filter-btn" id="toggle-mode">Overview Mode</button>
      </div>
    </div>

    <!-- Visual Filters -->
    <div class="filters">
      <!-- Colors Group -->
      <div class="filter-group">
        <span class="group-label">Colors</span>
        <div class="button-cluster">
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-blue"></button>
            <span>Blue</span>
          </div>
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-green"></button>
            <span>Green</span>
          </div>
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-yellow"></button>
            <span>Yellow</span>
          </div>
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-orange"></button>
            <span>Orange</span>
          </div>
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-red"></button>
            <span>Red</span>
          </div>
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-white"></button>
            <span>White</span>
          </div>
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-black"></button>
            <span>Black</span>
          </div>
        </div>
      </div>

      <!-- Patterns Group -->
      <div class="filter-group">
        <span class="group-label">Stripes</span>
        <div class="button-cluster">
          <div class="color-toggle">
            <button class="filter-btn-vis" id="toggle-stripes-hor">
              <svg viewBox="0 0 100 100">
                <rect x="20" y="20" width="60" height="25" fill="#cccccc" />
                <rect x="20" y="60" width="60" height="25" fill="#666666" />
              </svg>
            </button>
            <span>Bars</span>
          </div>
          <div class="color-toggle">
            <button id="toggle-stripes-ver" class="filter-btn-vis">
              <svg viewBox="0 0 100 100">
                <rect x="20" y="20" width="25" height="60" fill="#cccccc" />
                <rect x="60" y="20" width="25" height="60" fill="#666666" />
              </svg>
            </button>
            <span>Pales</span>
          </div>
        </div>
      </div>

      <!-- Symbols Group -->
      <div class="filter-group">
        <span class="group-label">Shapes</span>
        <div class="button-cluster">
          <div class="color-toggle">
            <button id="toggle-star" class="filter-btn-vis">
              <svg viewBox="0 0 32 32">
                <path
                  d="M29.3,12.7c-0.1-0.4-0.5-0.7-1-0.7h-8.7L17,3.7c-0.1-0.4-0.5-0.7-1-0.7s-0.8,0.3-1,0.7L12.4,12H3.7c-0.4,0-0.8,0.3-1,0.7 c-0.1,0.4,0,0.9,0.4,1.1l7,5.1l-2.7,8.3c-0.1,0.4,0,0.9,0.4,1.1c0.4,0.3,0.8,0.3,1.2,0l7-5.1l7,5.1c0.2,0.1,0.4,0.2,0.6,0.2 s0.4-0.1,0.6-0.2c0.4-0.3,0.5-0.7,0.4-1.1l-2.7-8.3l7-5.1C29.2,13.6,29.4,13.1,29.3,12.7z"
                  fill="#cccccc"
                ></path>
              </svg>
            </button>
            <span>Star</span>
          </div>
          <div class="color-toggle">
            <button id="toggle-moon" class="filter-btn-vis">
              <svg viewBox="0 0 32 32">
                <path
                  d="M10.895 7.574c0 7.55 5.179 13.67 11.567 13.67 1.588 0 3.101-0.38 4.479-1.063-1.695 4.46-5.996 7.636-11.051 7.636-6.533 0-11.83-5.297-11.83-11.83 0-4.82 2.888-8.959 7.023-10.803-0.116 0.778-0.188 1.573-0.188 2.39z"
                  fill="#cccccc"
                />
              </svg>
            </button>
            <span>Moon</span>
          </div>
          <div class="color-toggle">
            <button id="toggle-cross" class="filter-btn-vis">
              <svg viewBox="0 0 490 490" transform="rotate(45)">
                <polygon
                  points="386.813,0 245,141.812 103.188,0 0,103.188 141.813,245 0,386.812 103.187,489.999 245,348.187 386.813,490 490,386.812 348.187,244.999 490,103.187 "
                  fill="#cccccc"
                ></polygon>
              </svg>
            </button>
            <span>Cross</span>
          </div>
          <div class="color-toggle">
            <button id="toggle-triangle" class="filter-btn-vis">
              <svg viewBox="0 0 24 24">
                <path
                  d="M14.1735 2.22902C13.2063 0.590325 10.7938 0.590326 9.82664 2.22902L0.340215 18.3024C-0.657696 19.9933 0.63634 22 2.51362 22H21.4865C23.3638 22 24.6578 19.9933 23.6599 18.3024L14.1735 2.22902Z"
                  fill="#cccccc"
                ></path>
              </svg>
            </button>
            <span>Triangle</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Flag section -->
    <div id="flags-container"></div>
    <div id="letters-container"></div>
    <div id="country-modal" class="modal">
      <button id="modal-close" aria-label="Close">&times;</button>
      <!-- Country info will be inserted here -->
    </div>

    <div class="footer">
      <span class="footer">Powered by Robo [【•】◡【•】]</span>
      <a
        href="https://github.com/ironlegit/flagger"
        target="_blank"
        rel="noopener noreferrer"
        class="footer-github"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
        0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>

    <!-- JS Section -->
    <script src="js/script.js"></script>
  </body>
</html>
